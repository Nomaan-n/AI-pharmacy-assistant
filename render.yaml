services:
  - type: web
    name: ai-pharmacy-assistant
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4o-mini
      - key: APP_ENV
        value: production
      - key: ALLOWED_ORIGINS
        value: https://ai-pharmacy-assistant.onrender.com
