services:
  - type: web
    name: ai-pharmacy-assistant
    runtime: docker
    dockerfilePath: ./Dockerfile
    branch: mcp-write-test-2026-08-19
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: ai-pharmacy-db
          property: connectionString
      - key: CORS_ORIGINS
        value: "*"
      - key: OTP_DELIVERY
        value: "disabled"
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: SMTP_TLS
        value: "true"
databases:
  - name: ai-pharmacy-db
    plan: free
    region: frankfurt
