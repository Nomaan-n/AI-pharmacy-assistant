<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pharmacy Assistant Dashboard</title><style>body{font-family:system-ui;margin:0;background:#f5f7fb;color:#172033}.wrap{max-width:900px;margin:auto;padding:24px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}.card{background:#fff;border:1px solid #e0e5ee;border-radius:16px;padding:18px}.input,button{padding:11px;border-radius:10px;border:1px solid #d7deea}button{cursor:pointer;background:#245bd6;color:#fff;border:0}.row{display:flex;gap:8px;flex-wrap:wrap}pre{white-space:pre-wrap}.warn{background:#fff8e7;padding:12px;border-radius:10px}</style></head><body><main class="wrap"><h1>My Pharmacy Assistant</h1><p class="warn">Safety first. This dashboard stores medication data and reminders. It does not prescribe or confirm medication suitability.</p><section class="card"><h2>Sign in</h2><div class="row"><input class="input" id="identifier" placeholder="Email"><button onclick="otp()">Request OTP</button><input class="input" id="code" placeholder="6-digit OTP"><button onclick="verify()">Verify</button></div><small id="auth"></small></section><div class="grid"><section class="card"><h2>Medicine cabinet</h2><div class="row"><input class="input" id="med" placeholder="Medicine name"><button onclick="addMed()">Add</button></div><pre id="cabinet"></pre></section><section class="card"><h2>Reminder</h2><div class="row"><input class="input" id="title" placeholder="Reminder"><input class="input" id="schedule" placeholder="Schedule / ISO time"><button onclick="addReminder()">Save</button></div><pre id="reminders"></pre></section><section class="card"><h2>Grounded assistant</h2><input class="input" id="question" style="width:90%" placeholder="Ask about a medicine"><button onclick="chat()">Ask</button><pre id="chat"></pre></section></div></main><script>let token=localStorage.getItem('pharmacy_token')||'';const H=()=>token?{Authorization:'Bearer '+token}:{};async function otp(){const identifier=document.querySelector('#identifier').value;const r=await fetch('/api/auth/request-otp',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({identifier})});document.querySelector('#auth').textContent=JSON.stringify(await r.json())}async function verify(){const identifier=document.querySelector('#identifier').value,code=document.querySelector('#code').value;const r=await fetch('/api/auth/verify-otp',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({identifier,code})});const d=await r.json();if(d.access_token){token=d.access_token;localStorage.setItem('pharmacy_token',token);load()}document.querySelector('#auth').textContent=JSON.stringify(d)}async function load(){if(!token)return;for(const [id,url] of [['cabinet','/api/cabinet'],['reminders','/api/reminders']]){const r=await fetch(url,{headers:H()});document.querySelector('#'+id).textContent=JSON.stringify(await r.json(),null,2)}}async function addMed(){const name=document.querySelector('#med').value;const r=await fetch('/api/cabinet',{method:'POST',headers:{...H(),'Content-Type':'application/json'},body:JSON.stringify({name})});document.querySelector('#cabinet').textContent=JSON.stringify(await r.json(),null,2);load()}async function addReminder(){const r=await fetch('/api/reminders',{method:'POST',headers:{...H(),'Content-Type':'application/json'},body:JSON.stringify({title:document.querySelector('#title').value,schedule:document.querySelector('#schedule').value})});document.querySelector('#reminders').textContent=JSON.stringify(await r.json(),null,2);load()}async function chat(){const r=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:document.querySelector('#question').value,medication:document.querySelector('#med').value})});document.querySelector('#chat').textContent=JSON.stringify(await r.json(),null,2)}load()</script></body></html>
