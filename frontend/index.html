<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>AI Pharmacy Assistant</title>
  <style>
    body{font-family:system-ui,sans-serif;max-width:850px;margin:0 auto;padding:32px;background:#f6f7fb;color:#172033}
    main{background:white;padding:28px;border-radius:18px;box-shadow:0 8px 30px #00000012}
    h1{margin-top:0}.muted{color:#667085}.warning{padding:12px;border-radius:10px;background:#fff4e5;margin:14px 0}
    textarea{width:100%;min-height:110px;box-sizing:border-box;padding:12px;border:1px solid #d0d5dd;border-radius:10px;font:inherit}
    button{margin-top:12px;padding:11px 18px;border:0;border-radius:10px;cursor:pointer;font-weight:700}
    #result{margin-top:24px;white-space:pre-wrap;line-height:1.55}.source{margin-top:18px;font-size:.9rem}
  </style>
</head>
<body><main>
  <h1>AI Pharmacy Assistant</h1>
  <p class="muted">Medication information with grounded sources and safety-aware AI assistance.</p>
  <div class="warning">Educational use only. This tool is not a substitute for a doctor or pharmacist. For emergencies, seek immediate medical care.</div>
  <textarea id="question" placeholder="Ask about a medication, e.g. What is cetirizine used for?"></textarea>
  <button id="ask">Ask assistant</button>
  <section id="result"></section>
  <div id="source" class="source"></div>
</main>
<script>
const q=document.getElementById('question'), result=document.getElementById('result'), source=document.getElementById('source');
document.getElementById('ask').onclick=async()=>{
  result.textContent='Thinking…'; source.textContent='';
  try{
    const r=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({question:q.value})});
    const data=await r.json();
    if(!r.ok) throw new Error(data.detail||'Request failed');
    result.textContent=data.answer;
    if(data.source) source.innerHTML=`Source context: <a href="${data.source.url}" target="_blank" rel="noopener">${data.source.name}</a>`;
  }catch(e){result.textContent='Error: '+e.message}
};
</script></body></html>
