<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Instagram 3-Character Username Finder</title>
<style>
body{font:16px system-ui;max-width:900px;margin:auto;padding:20px}button{padding:10px;margin:4px}#u{font:700 36px monospace}.muted{color:#666}.row{display:flex;gap:8px;flex-wrap:wrap}.box{padding:14px;border:1px solid #ddd;border-radius:10px;margin:12px 0}.good{font-weight:700}
</style></head><body>
<h1>3-Character Username Finder</h1>
<p class="muted">This tool generates candidates and opens Instagram profile checks one at a time. It does not scrape Instagram or bypass rate limits.</p>
<div class="box"><div id="u">Ready</div><div id="stats"></div>
<div class="row">
<button onclick="start()">Start / Resume</button>
<button onclick="openIG()">Open Instagram check</button>
<button onclick="setStatus('available')">Available</button>
<button onclick="setStatus('taken')">Taken</button>
<button onclick="setStatus('unknown')">Unknown</button>
<button onclick="next()">Skip</button>
<button onclick="download()">Export CSV</button>
</div></div>
<div id="results"></div>
<script>
const chars='abcdefghijklmnopqrstuvwxyz', digits='0123456789', key='ig3safe';
let state=JSON.parse(localStorage.getItem(key)||'null')||{i:0,rows:[]};
let candidates=[];
for(const a of chars)for(const b of chars)for(const c of chars)candidates.push(a+b+c);
function current(){return candidates[state.i]}
function render(){
 let u=current();document.getElementById('u').textContent=u?'@'+u:'Finished';
 let counts={available:0,taken:0,unknown:0};state.rows.forEach(r=>counts[r.status]++);
 document.getElementById('stats').textContent='Progress '+Math.min(state.i,candidates.length)+'/'+candidates.length+' | Available '+counts.available+' | Taken '+counts.taken+' | Unknown '+counts.unknown;
 document.getElementById('results').innerHTML=state.rows.filter(r=>r.status==='available').slice(-30).reverse().map(r=>'<div>@'+r.username+' <span class="good">AVAILABLE (manual confirmation)</span></div>').join('');
 localStorage.setItem(key,JSON.stringify(state));
}
function start(){render();openIG()}
function openIG(){let u=current();if(u)window.open('https://www.instagram.com/'+u+'/', '_blank','noopener')}
function setStatus(s){let u=current();if(!u)return;state.rows=state.rows.filter(r=>r.username!==u);state.rows.push({username:u,status:s});next()}
function next(){if(state.i<candidates.length-1)state.i++;render()}
function download(){let csv='username,status\n'+state.rows.map(r=>r.username+','+r.status).join('\n');let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download='instagram_3char_results.csv';a.click()}
render();
</script></body></html>
