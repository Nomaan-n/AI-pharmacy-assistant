<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>3-Character Username Hunt</title>
<style>
body{font-family:system-ui,sans-serif;max-width:760px;margin:30px auto;padding:0 16px}
button{padding:10px 14px;margin:4px;border:1px solid #bbb;border-radius:8px;background:#fff}
.primary{font-size:1.1rem;font-weight:700}
#u{font-size:3rem;letter-spacing:.08em;margin:24px 0}
.bar{height:10px;background:#eee;border-radius:8px;overflow:hidden}.fill{height:100%;width:0;background:#333}
.small{color:#666}.row{display:flex;flex-wrap:wrap;gap:4px}
</style>
</head>
<body>
<h1>3-character username hunt</h1>
<p>This tool generates all unique 3-character candidates locally. It does not send automated requests to Instagram.</p>
<div id="u">aaa</div>
<div class="row">
<button class="primary" onclick="openIG()">Open Instagram</button>
<button onclick="setStatus('available')">Available</button>
<button onclick="setStatus('taken')">Taken</button>
<button onclick="setStatus('unclear')">Unclear</button>
<button onclick="next()">Skip</button>
</div>
<p id="stats"></p><div class="bar"><div class="fill" id="fill"></div></div>
<p class="small">Progress is saved in this browser.</p>
<div class="row">
<button onclick="exportCSV()">Export results CSV</button>
<button onclick="resetAll()">Reset</button>
</div>
<script>
const chars="abcdefghijklmnopqrstuvwxyz0123456789";
const candidates=[];
for(const a of chars)for(const b of chars)for(const c of chars)candidates.push(a+b+c);
let state=JSON.parse(localStorage.getItem("ig3hunt")||"{}");
let i=Number(localStorage.getItem("ig3idx")||0);
function save(){localStorage.setItem("ig3hunt",JSON.stringify(state));localStorage.setItem("ig3idx",i)}
function render(){document.getElementById("u").textContent=candidates[i];let done=Object.keys(state).length;document.getElementById("stats").textContent=`${done.toLocaleString()} checked/marked · ${i+1} of ${candidates.length}`;document.getElementById("fill").style.width=(done/candidates.length*100)+"%"}
function next(){i=(i+1)%candidates.length;save();render()}
function setStatus(s){state[candidates[i]]=s;i=(i+1)%candidates.length;save();render()}
function openIG(){window.open("https://www.instagram.com/"+candidates[i]+"/","_blank","noopener")}
function exportCSV(){let out="username,status\n"+Object.entries(state).map(([u,s])=>u+","+s).join("\n");let a=document.createElement("a");a.href=URL.createObjectURL(new Blob([out],{type:"text/csv"}));a.download="instagram-3char-results.csv";a.click()}
function resetAll(){if(confirm("Reset all saved results?")){state={};i=0;save();render()}}
render();
</script>
</body>
</html>
